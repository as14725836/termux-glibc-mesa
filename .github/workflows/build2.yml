name: 正式版 Mesa (aarch64, Auto Update + Detailed Log)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'refs/tags/**'
  schedule:
    - cron: "0 22 * * *"

permissions:
  contents: write
  actions: write

jobs:
  check-updates:
    runs-on: ubuntu-24.04-arm
    outputs:
      new_commit: ${{ steps.check.outputs.new_commit }}
      latest_hash: ${{ steps.check.outputs.latest_hash }}
    steps:
      - name: 检查 Mesa 上游更新
        id: check
        run: |
          echo "🔍 检查 Mesa 上游提交..."
          LATEST_HASH=$(git ls-remote https://gitlab.freedesktop.org/mesa/mesa.git refs/heads/main | awk '{print $1}')
          echo "最新上游提交: $LATEST_HASH"
          STATE_FILE=".mesa_latest_commit"
          if [ -f "$STATE_FILE" ]; then
            LAST_HASH=$(cat $STATE_FILE)
          else
            LAST_HASH=""
          fi
          echo "上次构建: $LAST_HASH"
          if [ "$LATEST_HASH" != "$LAST_HASH" ]; then
            echo "new_commit=true" >> $GITHUB_OUTPUT
            echo "latest_hash=$LATEST_HASH" >> $GITHUB_OUTPUT
          else
            echo "new_commit=false" >> $GITHUB_OUTPUT
          fi
  build:
    needs: check-updates
    if: ${{ needs.check-updates.outputs.new_commit == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-24.04-arm

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 显示构建环境信息
        run: |
          lsb_release -a || true
          uname -a
          lscpu | grep -E 'Model name|Architecture|CPU MHz|Core'
          free -h
          df -h
      - name: 安装依赖
        run: |
          sudo sed -i "s/^Types: deb$/Types: deb deb-src/" /etc/apt/sources.list.d/ubuntu.sources
          sudo apt update
          sudo apt install -y glslang-tools libxrandr-dev libxxf86vm-dev libxcb-shm0-dev libxcb-glx0-dev \
              libxext-dev llvm-19 libx11-dev libx11-xcb-dev libxcb1-dev libxcb-dri3-dev libxcb-present-dev \
              libxcb-randr0-dev libxcb-sync-dev libxcb-xfixes0-dev libxshmfence-dev libdrm-dev \
              libgbm-dev libegl1-mesa-dev libexpat1-dev libwayland-dev python3-pip
          pip3 install --user meson ninja mako
      - name: 克隆 Mesa 正式版
        run: |
          echo "📥 克隆 Mesa 仓库..."
          git clone https://gitlab.freedesktop.org/mesa/mesa.git
          cd mesa
          echo "🔍 获取最新稳定标签..."
          LATEST_TAG=$(git describe --tags `git rev-list --tags --max-count=1`)
          echo "最新标签: $LATEST_TAG"
          git checkout $LATEST_TAG
          echo "LATEST_TAG=$LATEST_TAG" >> $GITHUB_ENV
          echo "🧾 最新提交:"
          git log -1 --oneline --decorate

          echo "补丁应用"
          # 应用 patch/ 下的全部自定义补丁，任何一个失败都中止构建。
          # 顺序由文件名前缀决定（04/05/06/07 ...）。
          shopt -s nullglob
          PATCHES=($GITHUB_WORKSPACE/patch/*.patch)
          if [ ${#PATCHES[@]} -eq 0 ]; then
            echo "::error::patch/ 目录下没有任何补丁"
            exit 1
          fi
          for patch in "${PATCHES[@]}"; do
            echo "=================================================="
            echo "Applying $(basename "$patch")..."
            if ! patch -p1 --forward --fuzz=3 < "$patch"; then
              echo "::error::补丁应用失败: $(basename "$patch")"
              exit 1
            fi
          done
          echo "=================================================="

          echo "🔍 校验补丁效果..."
          grep -q 'image->drm_modifier = 1274' src/vulkan/wsi/wsi_common.c \
            || { echo "::error::KGSL DRI3 补丁未生效 (wsi_common.c)"; exit 1; }
          grep -q 'is_tu_kgsl' src/vulkan/wsi/wsi_common.h \
            || { echo "::error::KGSL DRI3 补丁未生效 (wsi_common.h)"; exit 1; }
          grep -q 'kgsl_get_info' src/freedreno/vulkan/tu_wsi.cc \
            || { echo "::error::Turnip KGSL WSI 补丁未生效"; exit 1; }
          grep -q '!env || !strcmp(env, "zink")' src/egl/main/eglapi.c \
            || { echo "::error::EGL 默认 zink 补丁未生效"; exit 1; }
          grep -q '!env || !strcmp(env, "zink")' src/glx/glxext.c \
            || { echo "::error::GLX 默认 zink 补丁未生效"; exit 1; }
          grep -q 'FD710' src/freedreno/common/freedreno_devices.py \
            || { echo "::warning::AD7xx GPU ID 补丁未生效"; }
          echo "✅ 补丁校验通过"

          echo "🔧 自定义品牌: Turnip → Qualcomm Snapdragon"
          sed -i 's/Turnip Adreno (TM) %s%s/Qualcomm Snapdragon Adreno (TM) %s%s/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"turnip Mesa driver"/"Qualcomm Snapdragon Driver"/' src/freedreno/vulkan/tu_device.cc
          sed -i 's/"Mesa " PACKAGE_VERSION MESA_GIT_SHA1/"Qualcomm Snapdragon " PACKAGE_VERSION MESA_GIT_SHA1/' src/freedreno/vulkan/tu_device.cc
      - name: 构建 Mesa
        run: |
          cd mesa
          BUILD_START=$(date +%s)
          sudo mkdir -p /data/data/com.termux/files/usr/glibc
          sudo chmod 777 -R /data
          mkdir -p builddir
          meson setup builddir \
            --libdir=lib \
            -Dprefix=/data/data/com.termux/files/usr/glibc \
            -Dbuildtype=release \
            -Dplatforms=x11 \
            -Degl-native-platform=x11 \
            -Dglx=dri \
            -Dglx-direct=true \
            -Dopengl=true \
            -Dgles1=enabled \
            -Dgles2=enabled \
            -Dglvnd=disabled \
            -Degl=enabled \
            -Dllvm=enabled \
            -Dshared-llvm=enabled \
            -Dshader-cache=enabled \
            -Dshared-glapi=enabled \
            -Dxlib-lease=enabled \
            -Dvulkan-beta=true \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dmicrosoft-clc=disabled \
            -Dgallium-rusticl=false \
            -Dgallium-extra-hud=true \
            -Dgallium-drivers=zink,freedreno,llvmpipe,softpipe \
            -Dgallium-rusticl-enable-drivers=freedreno \
            -Dshader-cache-default=true \
            -Dvulkan-drivers=freedreno,swrast \
            -Dfreedreno-kmds=kgsl \
            -Dvideo-codecs=all \
            -Dmediafoundation-codecs=all \
            -Dgbm=enabled \
            -Dtools=drm-shim,freedreno
          ninja -C builddir -j$(nproc)
          ninja -C builddir install
          BUILD_END=$(date +%s)
          echo "构建耗时: $((BUILD_END - BUILD_START)) 秒"
          VERSION=$(cat VERSION)
          GIT_HASH=$(git rev-parse --short HEAD)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "GIT_HASH=${GIT_HASH}" >> $GITHUB_ENV
      - name: 校验产物中的 KGSL / DRI3 / zink 支持
        run: |
          cd mesa
          echo "🔎 检查构建出的驱动库..."
          ls -la builddir/src/freedreno/vulkan/libvulkan_freedreno.so
          ls -la builddir/src/gallium/targets/dri/libgallium_dri.so 2>/dev/null || true

          echo "--- Turnip Vulkan 驱动应包含 KGSL 后端 ---"
          (nm -D --defined-only builddir/src/freedreno/vulkan/libvulkan_freedreno.so 2>/dev/null \
             | grep -i kgsl | head -5) || echo "(nm 不可用，跳过符号检查)"

          echo "--- zink gallium 驱动 ---"
          find builddir -name '*zink*' -o -name 'libgallium_dri.so' | head -5

          echo "--- GLX/EGL DRI 驱动 ---"
          find builddir/src -name 'libGLX_mesa.so*' -o -name 'libEGL_mesa.so*' | head -5
          echo "✅ 产物检查完成"
      - name: 打包构建产物
        run: |
          echo "📦 开始打包 Mesa 产物..."
          cd mesa
          PACK_START=$(date +%s)
          TAR_NAME="termux-glibc-mesa-${VERSION}-aarch64.tar.gz"
          tar -czvf "../${TAR_NAME}" -C builddir/src/freedreno/vulkan libvulkan_freedreno.so
          cd ..
          sha256sum "${TAR_NAME}" > "${TAR_NAME}.sha256"
          PACK_END=$(date +%s)
          echo "打包耗时: $((PACK_END - PACK_START)) 秒"
          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mesa-artifacts-${{ env.VERSION }}-aarch64
          path: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: mesa-${{ env.VERSION }}
          name: 正式版 Mesa ${{ env.VERSION }} (aarch64, Termux glibc)
          body: |
            Mesa 自动构建信息
            - 版本: **${{ env.VERSION }}**
            - 提交: `${{ env.GIT_HASH }}`
          files: |
            ${{ env.TAR_NAME }}
            ${{ env.TAR_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保存最新提交记录
        if: ${{ needs.check-updates.outputs.latest_hash != '' }}
        run: |
          echo "${{ needs.check-updates.outputs.latest_hash }}" > .mesa_latest_commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .mesa_latest_commit || true
          git commit -m "Update Mesa commit record" || true
          git push || true
      - name: 输出总结信息
        run: |
          echo "构建完成"
          echo "版本: ${{ env.VERSION }}"
          echo "提交: ${{ env.GIT_HASH }}"
